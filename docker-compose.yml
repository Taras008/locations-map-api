x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "true"
  # .env.example — робочі значення за замовчуванням, .env (необов'язковий) їх перевизначає.
  # Тож `docker compose up` працює на свіжому клоні без жодної підготовки.
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      GUNICORN_RELOAD: "true"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3).status != 200)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    <<: *app
    # Dev: watchfiles перезапускає worker при зміні .py (аналог GUNICORN_RELOAD для web) —
    # інакше нові задачі не реєструються й відкидаються з KeyError. watchfiles — dev-залежність,
    # у production worker запускається напряму: celery -A config worker ...
    command:
      - watchfiles
      - --filter
      - python
      - celery -A config worker --loglevel=INFO --concurrency=2
      - apps
      - common
      - config
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locations}
      POSTGRES_USER: ${POSTGRES_USER:-locations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locations}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
